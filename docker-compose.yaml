# Secrets come from the environment, never from this file. Copy .env.example
# to .env and fill it in before running: compose reads .env automatically.
services:

  app:
    build: .
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    environment:
      APP_PORT: ":8000"
      DB_DRIVER: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME:-pastebomb}"
      DB_USER: "${DB_USER:-user}"
      DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env, generate one with: openssl rand -hex 32}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8080}"
      AUDIT_LOG_DIR: "/var/log/pastebomb"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles:
      - all
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${DB_NAME:-pastebomb}"
      MYSQL_USER: "${DB_USER:-user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}"
    # Bound to loopback so the database is reachable for local development
    # without being published to every interface on the host.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_db_volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}", "--silent"]
      timeout: 20s
      retries: 10
      interval: 10s
    profiles:
      - depends
      - all
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./database/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=mysql://${DB_USER:-user}:${DB_PASSWORD}@tcp(db:3306)/${DB_NAME:-pastebomb}?charset=utf8mb4&parseTime=True&loc=UTC"
      - "up"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - depends
      - all
    restart: on-failure

volumes:
  mysql_db_volume:
